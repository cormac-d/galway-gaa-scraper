name: Galway GAA Weekly Scraper

# When should this run?
on:
  schedule:
    # Runs at 3:00 AM every Monday
    - cron: '0 3 * * 1'
  workflow_dispatch:
    # Allows you to click a button to run it manually anytime
    inputs:
      season_year:
        description: 'Season to scrape (e.g. 2025). Blank = current year.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  scrape-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Grab your code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install the required libraries
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      # 4. Run your scraper script
      - name: Run Scraper
        env:
          SEASON_YEAR: ${{ inputs.season_year }}
        run: python scraper.py

      # 5. Save the CSV so you can download it
      - name: Upload CSV as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GAA-Results-Spreadsheet
          path: "*.csv"
          retention-days: 30

      # 6. Commit the CSV into the repo so it can be read directly from git
      - name: Commit CSV to repository
        run: |
          set -euo pipefail

          CSV=$(ls -1 Galway_GAA_Football_Season_*.csv 2>/dev/null | head -n 1 || true)
          if [ -z "$CSV" ]; then
            echo "No CSV produced by the scraper; nothing to commit."
            exit 0
          fi

          YEAR="${{ inputs.season_year }}"
          [ -z "$YEAR" ] && YEAR=$(date -u +%Y)

          mkdir -p data
          cp "$CSV" "data/season_${YEAR}.csv"
          # latest.csv always tracks the current season
          if [ "$YEAR" = "$(date -u +%Y)" ]; then
            cp "$CSV" data/latest.csv
          fi

          ROWS=$(($(wc -l < "data/season_${YEAR}.csv") - 1))
          echo "season=$YEAR rows=$ROWS"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/
          if git diff --cached --quiet; then
            echo "No change in scraped data; nothing to commit."
            exit 0
          fi

          git commit -m "Scraped season ${YEAR} on $(date -u +%Y-%m-%d) (${ROWS} rows)"

          # Retry once in case the branch moved while this job ran
          git push || {
            git pull --rebase
            git push
          }
