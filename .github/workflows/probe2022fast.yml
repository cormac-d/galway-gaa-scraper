name: 2022 Competition Walk

# Walks the 2022 competition id range concurrently, looking for a senior
# championship group stage that is readable by id but absent from the season
# list. Separate from the "probe" workflow so it does not queue behind a run
# of that one.
#
# Triggered by editing probe2022.txt on main.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['probe2022.txt']

permissions:
  contents: write

concurrency:
  group: probe2022
  cancel-in-progress: true

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Walk the id range
        run: python probe2022fast.py

      - name: Commit findings
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "2022 competition walk $(date -u +'%Y-%m-%d %H:%M')"
          git push || true
