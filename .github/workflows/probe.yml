name: Competition ID Probe

# Investigates whether earlier seasons can be read by competition id, since
# the county results page only serves the current season.
#
# Triggered by editing probe.txt on main (a push trigger works from anywhere;
# workflow_dispatch needs the Actions UI). Also available as a manual run.
on:
  workflow_dispatch:
    inputs:
      host:
        description: 'Which county domain to read competitions through'
        required: false
        default: 'https://mayogaa.com'
  push:
    branches: [main]
    paths: ['probe.txt']

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run probe
        env:
          PROBE_HOST: ${{ inputs.host }}
        run: python probe.py

      - name: Commit findings
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/probe_report.md data/competition_index.csv
          if git diff --cached --quiet; then
            echo "No change in probe output."
            exit 0
          fi
          git commit -m "Competition id probe $(date -u +%Y-%m-%d\ %H:%M)"
          git push || { git pull --rebase && git push; }
